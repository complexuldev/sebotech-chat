# Builds the FolkChat Windows app (desktop/tauri) – a small native shell around the live site with
# game detection, in-game push-to-talk, a see-through overlay, tray and start-with-Windows.
# Runs on pushes that touch the Windows app, or by hand: Actions → "Build FolkChat for Windows" → Run workflow.
name: Build FolkChat for Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write          # needed to publish the GitHub Release

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: App icons
        run: tauri icon ../icon.png

      - name: Build FolkChat
        run: |
          $version = "1.0.${{ github.run_number }}"
          Set-Content -Path version.json -Value ('{"version":"' + $version + '"}') -Encoding utf8NoBOM
          tauri build --ci --config version.json
          New-Item -ItemType Directory -Force -Path ../../dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was built" }
          Copy-Item $setup.FullName ../../dist/FolkChat-Setup.exe
          Copy-Item target/release/folkchat.exe ../../dist/FolkChat.exe
          Get-ChildItem ../../dist | Format-Table Name, Length

      - name: Measure RAM (login screen, 45 s after start)
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath ../../dist/FolkChat.exe -PassThru
          Start-Sleep -Seconds 45
          $kids = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'msedgewebview2.exe' } | ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
          $all = @(Get-Process -Id $p.Id -ErrorAction SilentlyContinue) + @($kids)
          $ws = [math]::Round(($all | Measure-Object WorkingSet64 -Sum).Sum / 1MB)
          $pv = [math]::Round(($all | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB)
          $all | Sort-Object WorkingSet64 -Descending | Format-Table ProcessName, Id, @{n='WS MB';e={[math]::Round($_.WorkingSet64/1MB)}}, @{n='Private MB';e={[math]::Round($_.PrivateMemorySize64/1MB)}}
          echo "::notice title=FolkChat RAM::$($all.Count) processes · working set $ws MB · private $pv MB"
          $all | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolkChat-Windows
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.${{ github.run_number }}
          name: FolkChat for Windows 1.0.${{ github.run_number }}
          body: |
            **Download `FolkChat-Setup.exe`** and open it (no admin needed). Or run `FolkChat.exe` without installing.
            Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            New in this app: automatic game detection, push-to-talk that works inside games, a see-through overlay over games, start with Windows.
            Closing the window keeps FolkChat running next to the clock so calls and messages still ring — right-click the tray icon to quit.
          files: dist/*
          make_latest: true
