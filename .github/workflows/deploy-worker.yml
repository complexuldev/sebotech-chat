# Deploys the Cloudflare media/push worker (cloudflare/worker.js). Run by hand:
# Actions → "Deploy FolkChat media worker" → Run workflow.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN    Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template (+ R2 edit)
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard → Workers & Pages → Account ID (right side)
# Optional, for push notifications:
#   FIREBASE_SA_JSON        Firebase → Project settings → Service accounts → Generate new private key (whole JSON)
name: Deploy FolkChat media worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the R2 bucket (first time only)
        run: npx --yes wrangler@4 r2 bucket create folkchat-media || echo "bucket already exists"
      - name: Deploy worker
        run: npx --yes wrangler@4 deploy
      - name: Set push-notification secrets
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "No FIREBASE_SA_JSON secret – push notifications stay off (uploads work)."; exit 0; fi
          node -e "const j=JSON.parse(process.env.SA_JSON); require('fs').writeFileSync('/tmp/email', j.client_email); require('fs').writeFileSync('/tmp/key', j.private_key);"
          npx --yes wrangler@4 secret put SA_CLIENT_EMAIL < /tmp/email
          npx --yes wrangler@4 secret put SA_PRIVATE_KEY < /tmp/key
          rm -f /tmp/email /tmp/key
      - name: Show the worker URL
        run: |
          echo "Your worker URL is shown in the 'Deploy worker' step above (https://folkchat-media.<you>.workers.dev)."
          echo "Put it in config.js → MEDIA_URL."
